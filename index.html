<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>シナリオ整形ツール</title>
<link rel="icon" href="icon.png?v=2" />
<link rel="apple-touch-icon" href="icon.png?v=2" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#ff9500" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="シナリオ整形ツール" />
<link rel="stylesheet" href="style.css?v=12" />
</head>
<body class="mode-edit">

<div class="app-chrome" id="app-chrome">
<header class="app-header">
  <h1 class="app-header__title">シナリオ整形ツール</h1>

  <div class="mode-switch" id="mode-switch" hidden>
    <button type="button" class="mode-switch__btn is-active" data-mode="edit" id="btn-mode-edit">編集</button>
    <button type="button" class="mode-switch__btn" data-mode="preview" id="btn-mode-preview">プレビュー</button>
  </div>

  <button type="button" class="app-header__menu-btn" id="btn-sidebar-open" hidden aria-label="メニューを開く">☰</button>
</header>

<!-- 編集用リボン(Word風、常時上部に固定表示。5.3。iPhone/iPad実機検証で、選択範囲に
     追従するミニツールバーがOS標準のコピー&ペーストのポップアップと重なってタップ
     できなくなる不具合が判明したため、2026-07-25にこの形式に変更した) -->
<div class="mini-toolbar" id="mini-toolbar" hidden>
  <button type="button" id="btn-undo" title="元に戻す" disabled>↩️元に戻す</button>
  <!-- サイドバーが長くなりすぎたため、旧「編集ツール」セクションの機能をここへ移した
       (2026-07-27、Mikoto要望)。選択範囲を必要としない操作なので data-action は付けず、
       常時押せるようにしている。狭い画面でもスクロールせず届くよう前方に置く。 -->
  <button type="button" id="btn-find-toggle" title="検索・一括置換">🔍</button>
  <button type="button" id="btn-remove-empty-lines" title="空行をまとめて削除">空行削除</button>
  <span class="mini-toolbar__sep"></span>
  <button type="button" data-action="heading" title="見出しにする" disabled>見出し</button>
  <button type="button" data-action="copybtn" title="コピペボタン設置" disabled>📋+</button>
  <button type="button" data-action="npc" title="選択範囲からNPCカードを作成" disabled>👤</button>
  <button type="button" data-action="link" title="内部リンクを設定" disabled>🔗</button>
  <span class="mini-toolbar__sep"></span>
  <button type="button" data-action="bold" title="太字" disabled><b>B</b></button>
  <button type="button" data-action="italic" title="イタリック" disabled><i>I</i></button>
  <button type="button" data-action="underline" title="下線" disabled><u>U</u></button>
</div>

<!-- 検索・一括置換バー(5.16)。リボンの🔍で開閉する。検索と一括置換はボタンを分けたまま
     (2026-07-27、Mikoto要望により統合しない)。 -->
<div class="find-bar" id="find-bar" hidden>
  <div class="find-bar__row">
    <input type="text" class="find-bar__input" id="find-input" placeholder="検索する文字列" />
    <button type="button" class="find-bar__btn" id="btn-find-run">検索</button>
    <button type="button" class="find-bar__btn" id="btn-find-prev" title="前の一致箇所へ" disabled>↑</button>
    <button type="button" class="find-bar__btn" id="btn-find-next" title="次の一致箇所へ" disabled>↓</button>
    <button type="button" class="find-bar__btn find-bar__btn--close" id="btn-find-close" title="閉じる">×</button>
  </div>
  <div class="find-bar__row">
    <input type="text" class="find-bar__input" id="replace-input" placeholder="置換後の文字列" />
    <button type="button" class="find-bar__btn" id="btn-replace-all">一括置換</button>
  </div>
  <p class="find-bar__status" id="find-status"></p>
</div>
</div>

<div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
<aside class="sidebar" id="sidebar" hidden>
  <div class="sidebar__header">
    <span class="sidebar__title" id="sidebar-title">メニュー</span>
    <button type="button" class="icon-btn" id="btn-sidebar-close" aria-label="閉じる">×</button>
  </div>
  <div class="sidebar__export" id="export-bar" hidden>
    <h3 class="sidebar-section__title">書き出し</h3>
    <div class="sidebar__export-row">
      <select id="export-format-select">
        <option value="html">HTML(セッション用)</option>
        <option value="markdown">Markdown(記録用)</option>
        <option value="text">テキスト(.txt)</option>
      </select>
      <button type="button" class="btn btn--secondary" id="btn-export-download">書き出す</button>
    </div>
    <!-- 上書き保存(5.14)。File System Access API対応ブラウザでHTMLを選んでいるときだけ表示する -->
    <p class="export-target" id="export-target" hidden></p>
    <button type="button" class="btn btn--secondary btn--small btn--block" id="btn-export-saveas" hidden>別名で保存</button>
    <!-- iPhone・iPad向け(5.14)。共有シートの「ファイルに保存」から、同名ファイルを置き換えられる -->
    <button type="button" class="btn btn--secondary btn--small btn--block" id="btn-export-share" hidden>共有して保存</button>
  </div>
  <div class="sidebar__body" id="sidebar-body"></div>
</aside>

<main>

  <!-- 読み込みエリア -->
  <section class="panel" id="section-load">
    <h2 class="panel__title">シナリオを読み込む</h2>
    <p class="panel__desc">
      PDF・TXTファイル、または本ツールで書き出したHTMLファイルを選んでください。<br>
      複数のファイルをまとめて選ぶこともできます(選んだ順に上から連結されます)。<br>
      PDFの場合は文字情報を抽出します(レイアウトによっては抽出結果が乱れる場合があります)。
    </p>
    <label class="btn btn--primary btn--block" for="file-input">ファイルを選ぶ</label>
    <input type="file" id="file-input" accept=".pdf,.txt,.html,application/pdf,text/plain,text/html" multiple hidden />
    <p class="load-status" id="load-status">まだファイルが読み込まれていません。</p>

    <!-- 自動保存からの復元(5.17)。保存データがあるときだけ表示する -->
    <div class="resume" id="resume-panel" hidden>
      <h3 class="resume__title">前回の続き</h3>
      <p class="resume__desc">編集内容はこのブラウザ内に自動保存されています。続きから再開できます。</p>
      <div id="resume-list"></div>
    </div>
  </section>

  <!-- 編集エリア -->
  <section class="panel" id="section-editor" hidden>
    <p class="panel__desc">本文をドラッグして選択すると、上部のリボンのボタンで見出し化・文字装飾・コピペボタン設置ができます。</p>
    <div class="editor-body" id="editor-body" contenteditable="true" spellcheck="false"></div>
  </section>

  <!-- プレビューエリア -->
  <section class="panel panel--preview" id="section-preview" hidden>
    <div class="preview-layout">
      <div class="preview-content" id="preview-content"></div>
      <aside class="toc-panel" id="toc-panel-inline">
        <h3 class="toc-panel__title">目次</h3>
        <div id="toc-list-inline" class="toc-list"></div>
        <h3 class="toc-panel__title toc-panel__title--npc">NPCカード</h3>
        <div id="npc-cards-inline"></div>
      </aside>
    </div>
  </section>

</main>

<!-- 内部リンクのリンク先選択ピッカー -->
<div class="link-picker-backdrop" id="link-picker-backdrop" hidden></div>
<div class="link-picker" id="link-picker" hidden>
  <div class="link-picker__header">
    <span>リンク先を選択</span>
    <button type="button" class="icon-btn" id="btn-link-picker-close" aria-label="閉じる">×</button>
  </div>
  <div class="link-picker__body" id="link-picker-body"></div>
</div>

<!-- コピー成否のトースト通知 -->
<div class="toast" id="toast" hidden></div>

<script src="vendor/pdfjs/pdf.min.js"></script>
<script src="app.js?v=13"></script>
</body>
</html>
